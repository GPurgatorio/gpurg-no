<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>404 - Page Not Found | no.gpurg.com</title>
  <meta name="theme-color" content="#181920">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #181920;
      color: #f3f4f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .unit {
      background: #21232d;
      border: 2px solid #ef4444;
      border-radius: 14px;
      box-shadow: 0 6px 0 #0e0f14;
      max-width: 480px;
      width: 100%;
      padding: 1.75rem;
    }
    h1 {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #f87171;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f3f4f8;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.92rem;
      color: #9ca3b5;
      line-height: 1.55;
      margin-bottom: 1.5rem;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #f3f4f8;
      background: #14151c;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
    }
    .btn {
      display: inline-block;
      padding: 0.65rem 1.15rem;
      background: #282b37;
      color: #f3f4f8;
      border: 2px solid #3c4052;
      border-radius: 10px;
      box-shadow: 0 3px 0 #0e0f14;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover {
      border-color: #f87171;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0e0f14;
    }
  </style>
</head>
<body>
  <main class="unit" role="main">
    <h1>NO. (404)</h1>
    <h2>Route Not Found</h2>
    <p>Even this URL is invalid. Use fragment hashes on the root domain (e.g., <code>/#missing-infos</code> or <code>/#pick2</code>) to open a scenario.</p>
    <a href="/" class="btn">⌂ Home</a>
  </main>
</body>
</html>
